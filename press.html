<style>
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --surface-2: #f6f7fb; --line: #e7e9f1;
    --ink: #12162e; --ink-2: #3b4160; --muted: #6b7190;
    --accent: #4f46e5; --accent-bg: #eef0ff; --navy: #141a3c;
    --pend-bg: #fff4d6; --pend-ink: #7a4b00;
    --shadow: 0 1px 2px rgba(18,22,46,.04), 0 8px 24px rgba(18,22,46,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e1d; --surface: #141830; --surface-2: #1a1f3b; --line: #262c4d;
      --ink: #eef0fb; --ink-2: #c3c8e3; --muted: #8f95b8;
      --accent: #8b8cff; --accent-bg: #23285a; --navy: #2b3478;
      --pend-bg: #3a2e10; --pend-ink: #ffd27a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  .tricolor { display: grid; grid-template-columns: repeat(3, 1fr); height: 4px; }
  .tricolor i:nth-child(1) { background: #f5c518; } .tricolor i:nth-child(2) { background: #1e40af; } .tricolor i:nth-child(3) { background: #dc2626; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 4vw, 40px); background: var(--surface); border-bottom: 1px solid var(--line); }
  .marca { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
  .marca .logo { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; }
  .marca .logo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.2); display: block; }
  .marca b { display: block; font-size: 15px; line-height: 1.15; }
  .marca small { display: block; font-size: 11.5px; color: var(--muted); }
  .top nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .top nav a { font-size: 13.5px; font-weight: 600; text-decoration: none; padding: 8px 14px; border-radius: 99px; color: var(--ink-2); }
  .top nav a.cta { background: var(--navy); color: #fff; }

  main { max-width: 780px; margin: 0 auto; padding: clamp(28px, 6vw, 56px) 16px 72px; }
  .etiqueta { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-bg); padding: 5px 12px; border-radius: 99px; margin-bottom: 18px; }
  h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; letter-spacing: -.03em; margin: 0 0 16px; font-weight: 800; }
  .bajada { font-size: clamp(17px, 2.2vw, 20px); line-height: 1.5; color: var(--ink-2); margin: 0 0 22px; }
  .datos-pub { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 30px; }
  h2 { font-size: 23px; letter-spacing: -.02em; margin: 44px 0 12px; line-height: 1.25; }
  h3 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 16px; font-size: 16.5px; }
  .lead::first-letter { font-weight: 800; }

  .cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 26px 0 8px; }
  .cifra { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .cifra b { display: block; font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cifra span { font-size: 13px; color: var(--muted); line-height: 1.35; display: block; margin-top: 4px; }
  .nota-cifras { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

  blockquote { margin: 26px 0; padding: 18px 22px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 18px; line-height: 1.5; }
  blockquote cite { display: block; margin-top: 10px; font-size: 14px; font-style: normal; color: var(--muted); }

  .comparacion { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); margin: 18px 0 6px; font-size: 14.5px; }
  .comparacion th, .comparacion td { text-align: left; vertical-align: top; padding: 13px 16px; border-bottom: 1px solid var(--line); line-height: 1.5; }
  .comparacion tr:last-child td { border-bottom: 0; }
  .comparacion thead th { background: var(--surface-2); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .comparacion td:first-child { font-weight: 700; width: 22%; }
  .comparacion td:last-child { color: var(--ink); }
  .comparacion td:nth-child(2) { color: var(--ink-2); }

  .novedades { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
  .novedad { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .novedad p { font-size: 14.5px; color: var(--ink-2); margin: 0; line-height: 1.55; }

  .equipo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
  .persona { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .persona .ini { width: 46px; height: 46px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .persona p { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; line-height: 1.5; }
  .persona .rol { font-size: 13px; color: var(--accent); font-weight: 700; display: block; }

  .contacto { background: var(--navy); color: #fff; border-radius: 20px; padding: 24px clamp(18px, 4vw, 28px); margin: 40px 0 0; }
  .contacto h2 { margin-top: 0; color: #fff; }
  .contacto p, .contacto li { color: rgba(255,255,255,.86); font-size: 15px; }
  .contacto a { color: #fff; font-weight: 700; }
  .contacto ul { margin: 0 0 16px; padding-left: 20px; }
  .boton { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 99px; background: #fff; color: #141a3c !important; text-decoration: none; font-weight: 700; font-size: 14.5px; }

  .pend { background: var(--pend-bg); color: var(--pend-ink); border-radius: 6px; padding: 1px 6px; font-weight: 700; }
  .fin { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
  footer { border-top: 1px solid var(--line); padding: 22px 16px 34px; text-align: center; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); margin: 0 8px; }

  @media (max-width: 640px) {
    .cifras, .novedades, .equipo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .novedades, .equipo { grid-template-columns: minmax(0, 1fr); }
    .top nav a:not(.cta) { display: none; }
    .comparacion thead { display: none; }
    .comparacion, .comparacion tbody, .comparacion tr, .comparacion td { display: block; width: 100%; }
    .comparacion tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
    .comparacion tr:last-child { border-bottom: 0; }
    .comparacion td { border: 0; padding: 6px 16px; }
    .comparacion td:first-child { width: 100%; padding-top: 12px; }
    .comparacion td:not(:first-child)::before { content: attr(data-col) ': '; font-weight: 700; color: var(--muted); }
    .comparacion td:last-child::before { color: var(--accent); }
  }
  .cargando, .vacio { color: var(--muted); text-align: center; padding: 60px 0; }
  .otras { margin-top: 44px; }
  .otras a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; text-decoration: none; color: var(--ink); }
  .otras a small { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 2px; }
  .otras a b { font-size: 15.5px; line-height: 1.35; display: block; }
  ul.lista { padding-left: 20px; margin: 0 0 16px; } ul.lista li { margin-bottom: 8px; font-size: 16px; }
  .quote-md { margin: 22px 0; padding: 6px 0 6px 18px; border-left: 3px solid var(--accent); color: var(--ink-2); font-size: 17px; }
  /* ══ Gráficos ══ */
  :root { --g-c1: #4f46e5; --g-c2: #c2410c; --g-si: #2563eb; --g-no: #c2410c; --g-abs: #9ca3af; --g-bar: #4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --g-c1: #7c7dff; --g-c2: #ea580c; --g-si: #3b82f6; --g-no: #ea580c; --g-abs: #6b7280; --g-bar: #7c7dff; } }
  .grafico { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px clamp(14px, 3vw, 22px) 14px; margin: 24px 0; box-shadow: var(--shadow); }
  .grafico > h3 { font-size: 16.5px; margin: 0 0 2px; letter-spacing: -.01em; }
  .grafico > .g-sub { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
  .g-leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 0 0 8px; padding: 0; list-style: none; }
  .g-leyenda li { display: inline-flex; align-items: center; gap: 7px; }
  .g-leyenda i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .g-leyenda i.cuad { width: 11px; height: 11px; border-radius: 3px; }
  .g-svg { width: 100%; display: block; overflow: visible; touch-action: pan-y; }
  .g-svg text { font-family: inherit; }
  .g-eje { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .g-dir { fill: var(--ink-2); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .g-fuente { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
  .g-tabla { margin-top: 8px; font-size: 13px; }
  .g-tabla summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; padding: 6px 0; width: max-content; }
  .g-tabla table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .g-tabla th, .g-tabla td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .g-tabla th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .g-tabla td + td, .g-tabla th + th { text-align: right; }
  .g-scroll { overflow-x: auto; }
  #g-tip { position: fixed; z-index: 50; pointer-events: none; background: var(--navy); color: #fff; font-size: 12.5px; line-height: 1.45; padding: 8px 11px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 260px; opacity: 0; transition: opacity .12s; }
  #g-tip.ver { opacity: 1; }
  #g-tip b { font-variant-numeric: tabular-nums; }
  #g-tip .t-f { display: flex; align-items: center; gap: 7px; } #g-tip .t-f i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  /* barras horizontales (temas) */
  .hb { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: center; }
  .hb-l { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
  .hb-f { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hb-b { height: 18px; background: var(--g-bar); border-radius: 0 4px 4px 0; min-width: 3px; }
  .hb-v { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* votaciones apiladas al 100 % */
  .vt { margin: 0 0 16px; } .vt:last-of-type { margin-bottom: 4px; }
  .vt-q { font-size: 14px; line-height: 1.45; margin: 0 0 6px; color: var(--ink); }
  .vt-q small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .vt-b { display: flex; gap: 2px; height: 26px; }
  .vt-b span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2px; overflow: hidden; white-space: nowrap; }
  .vt-b span:first-child { border-radius: 4px 0 0 4px; } .vt-b span:last-child { border-radius: 0 4px 4px 0; }
  .vt-b .si { background: var(--g-si); } .vt-b .abs { background: var(--g-abs); color: #12162e; } .vt-b .no { background: var(--g-no); }
  /* nube de palabras */
  .nube { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; padding: 10px 4px 4px; line-height: 1.15; }
  .nube span { font-weight: 700; letter-spacing: -.02em; cursor: default; color: var(--ink-2); }
  .nube span.n1 { color: var(--accent); font-weight: 800; }
  .nube span.n2 { color: var(--ink); }
  .nube span:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  /* totales en vivo */
  .totales { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 640px) { .cifras.totales { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .hb { grid-template-columns: minmax(0, 1fr); gap: 2px 0; } .hb-f { margin-bottom: 8px; } }
</style>
</head>
<body>
<div class="tricolor" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">

<script>
(function () {
  const E = window.__ENV || {}
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const $ = id => document.getElementById(id)
  // Formato de los textos (simple y seguro): **negrita**, [texto](https://enlace), ## título, ### subtítulo, - lista, > cita, | tabla |
  function enLinea(t) {
    let h = esc(t)
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    h = h.replace(/\[([^\]]+)\]\(((?:https:\/\/|\/)[^\s)]+)\)/g, (m, txt, url) => `<a href="${url.replace(/"/g, '%22')}"${url.startsWith('/') ? '' : ' target="_blank" rel="noopener"'}>${txt}</a>`)
    return h
  }
  function cifrasHtml(n) {
    if (!n.cifras?.length) return ''
    return `<div class="cifras" role="list" aria-label="En números">${n.cifras.map(c => `<div class="cifra" role="listitem"><b>${esc(c.valor)}</b><span>${esc(c.texto)}</span></div>`).join('')}</div>`
      + (n.cifras_nota ? `<p class="nota-cifras">${esc(n.cifras_nota)}</p>` : '')
  }
  function citaHtml(n) {
    if (!n.cita_texto) return ''
    const quien = [n.cita_autor, n.cita_cargo].filter(Boolean).map(esc).join(', ')
    return `<blockquote>«${esc(n.cita_texto)}»${quien ? `<cite>— ${quien}</cite>` : ''}</blockquote>`
  }
  // ══ Gráficos: se alimentan de las estadísticas agregadas que calcula la base de datos (stats) ══
  let S = {}, CFG = {}
  const num = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.')
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']
  const semTxt = s => { const [, m, d] = String(s).split('-').map(Number); return `${d} ${MES[m - 1] || ''}` }
  const pct = (a, t) => t ? Math.round(a * 100 / t) : 0
  const techo = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * p >= v) return k * p; return 10 * p }
  const tabla = (cab, filas) => `<details class="g-tabla"><summary>Ver los datos</summary><div class="g-scroll"><table><thead><tr>${cab.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${filas.map(f => `<tr>${f.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`
  const fig = (id, titulo, sub, dentro, fuente) => `<figure class="grafico" id="g-${id}"><h3>${esc(titulo)}</h3>${sub ? `<p class="g-sub">${esc(sub)}</p>` : ''}${dentro}${fuente ? `<p class="g-fuente">${esc(fuente)}</p>` : ''}</figure>`
  const FUENTE = () => 'Fuente: datos agregados de Cabildo de Venezuela' + (S.calculado ? `, actualizados el ${semTxt(S.calculado.slice(0, 10))} de ${S.calculado.slice(0, 4)}.` : '.')

  // Tooltip único para todos los gráficos
  const tip = document.createElement('div'); tip.id = 'g-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip)
  function verTip(html, x, y) { tip.innerHTML = html; tip.classList.add('ver'); const r = tip.getBoundingClientRect(); let l = x + 14, t = y - r.height - 12; if (l + r.width > innerWidth - 8) l = x - r.width - 14; if (l < 8) l = 8; if (t < 8) t = y + 18; tip.style.left = l + 'px'; tip.style.top = t + 'px' }
  const ocultarTip = () => tip.classList.remove('ver')
  document.addEventListener('pointerover', e => { const el = e.target.closest?.('[data-tip]'); if (el) verTip(el.dataset.tip, e.clientX, e.clientY) })
  document.addEventListener('pointermove', e => { const el = e.target.closest?.('[data-tip]'); if (el) verTip(el.dataset.tip, e.clientX, e.clientY) })
  document.addEventListener('pointerout', e => { if (e.target.closest?.('[data-tip]')) ocultarTip() })
  addEventListener('scroll', ocultarTip, { passive: true })
  const fila = (color, txt, val) => `<span class="t-f"><i style="background:${color}"></i>${txt}: <b>${val}</b></span>`

  // Línea: crecimiento de cuentas y butacas
  function gCrecimiento() {
    const d = S.crecimiento || []; if (d.length < 2) return ''
    const ult = d[d.length - 1]
    return fig('crecimiento', 'Cómo creció la primera versión', `De la primera cuenta, en agosto, a ${num(ult.cuentas)} cuentas y ${num(ult.butacas)} butacas verificadas. Total acumulado por semana.`,
      `<ul class="g-leyenda"><li><i style="background:var(--g-c1)"></i>Cuentas registradas</li><li><i style="background:var(--g-c2)"></i>Butacas verificadas</li></ul><div class="g-lienzo" data-g="linea"></div>`
      + tabla(['Semana del', 'Cuentas', 'Butacas'], d.map(x => [semTxt(x.semana), num(x.cuentas), num(x.butacas)])), FUENTE() + ' Una butaca es una persona con identidad verificada.')
  }
  function dibujarLinea(el) {
    const d = S.crecimiento || [], W = Math.max(280, el.clientWidth), H = W < 480 ? 220 : 260
    const m = { l: 40, r: W < 480 ? 46 : 56, t: 14, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b
    const max = techo(Math.max(...d.map(x => Math.max(x.cuentas, x.butacas))))
    const X = i => m.l + i * iw / (d.length - 1), Y = v => m.t + ih - v / max * ih
    const ticks = [0, .25, .5, .75, 1].map(k => k * max)
    const paso = W < 480 ? 3 : 2
    const camino = k => d.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(x[k]).toFixed(1)}`).join('')
    const u = d.length - 1
    let yc = Y(d[u].cuentas), yb = Y(d[u].butacas); if (yb - yc < 16) yb = yc + 16
    el.innerHTML = `<svg class="g-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de líneas: cuentas registradas y butacas verificadas por semana">
      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text class="g-eje" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${t >= 1000 ? num(t / 1000) + ' mil' : num(t)}</text>`).join('')}
      ${d.map((x, i) => (i % paso === (u % paso)) ? `<text class="g-eje" x="${X(i)}" y="${H - 8}" text-anchor="middle">${semTxt(x.semana)}</text>` : '').join('')}
      <path d="${camino('cuentas')}" fill="none" stroke="var(--g-c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${camino('butacas')}" fill="none" stroke="var(--g-c2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(u)}" cy="${Y(d[u].cuentas)}" r="4" fill="var(--g-c1)" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${X(u)}" cy="${Y(d[u].butacas)}" r="4" fill="var(--g-c2)" stroke="var(--surface)" stroke-width="2"/>
      <text class="g-dir" x="${X(u) + 9}" y="${yc + 4}">${num(d[u].cuentas)}</text>
      <text class="g-dir" x="${X(u) + 9}" y="${yb + 4}">${num(d[u].butacas)}</text>
      <g class="g-cruz" style="display:none"><line y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><circle r="5" fill="var(--g-c1)" stroke="var(--surface)" stroke-width="2"/><circle r="5" fill="var(--g-c2)" stroke="var(--surface)" stroke-width="2"/></g>
      <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>`
    const svg = el.firstElementChild, cruz = svg.querySelector('.g-cruz'), [ln, c1, c2] = cruz.children
    const mover = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width
      const i = Math.max(0, Math.min(u, Math.round((px - m.l) / (iw / u)))), x = d[i]
      cruz.style.display = ''; ln.setAttribute('x1', X(i)); ln.setAttribute('x2', X(i))
      c1.setAttribute('cx', X(i)); c1.setAttribute('cy', Y(x.cuentas)); c2.setAttribute('cx', X(i)); c2.setAttribute('cy', Y(x.butacas))
      verTip(`Semana del <b>${semTxt(x.semana)}</b><br>${fila('var(--g-c1)', 'Cuentas', num(x.cuentas))}${fila('var(--g-c2)', 'Butacas', num(x.butacas))}`, e.clientX, e.clientY)
    }
    svg.addEventListener('pointermove', mover); svg.addEventListener('pointerdown', mover)
    svg.addEventListener('pointerleave', () => { cruz.style.display = 'none'; ocultarTip() })
  }

  // Barras: participación semanal en votaciones
  function gActividad() {
    let d = S.actividad || []; const i0 = d.findIndex(x => x.votos > 0); if (i0 < 0) return ''
    d = d.slice(i0)
    const tv = d.reduce((a, x) => a + x.votos, 0), tm = d.reduce((a, x) => a + x.mensajes, 0)
    return fig('actividad', 'Participación en votaciones, semana a semana', `Cada barra suma las participaciones de las votaciones que cerraron esa semana. En total, ${num(tv)} participaciones y ${num(tm)} mensajes de debate.`,
      `<div class="g-lienzo" data-g="barras"></div>` + tabla(['Semana del', 'Participaciones', 'Mensajes'], d.map(x => [semTxt(x.semana), num(x.votos), num(x.mensajes)])), FUENTE() + ' Cada butaca vota una sola vez por votación.')
  }
  function dibujarBarras(el) {
    const todo = S.actividad || [], d = todo.slice(Math.max(0, todo.findIndex(x => x.votos > 0)))
    const W = Math.max(280, el.clientWidth), H = W < 480 ? 200 : 230, m = { l: 40, r: 6, t: 22, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b
    const max = techo(Math.max(...d.map(x => x.votos))), Y = v => m.t + ih - v / max * ih
    const bw = iw / d.length, ancho = Math.min(46, bw * .62), pico = d.reduce((a, x, i) => x.votos > d[a].votos ? i : a, 0)
    const barra = (x, y, w, h) => { const r = Math.min(4, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z` }
    el.innerHTML = `<svg class="g-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de barras: participaciones en votaciones por semana">
      ${[0, .5, 1].map(k => k * max).map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text class="g-eje" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${t >= 1000 ? num(t / 1000) + ' mil' : num(t)}</text>`).join('')}
      ${d.map((x, i) => { const cx = m.l + bw * i + bw / 2, h = Math.max(0, ih - (Y(x.votos) - m.t))
        return `<g data-tip="${esc(`Semana del <b>${semTxt(x.semana)}</b><br>Participaciones: <b>${num(x.votos)}</b><br>Mensajes de debate: <b>${num(x.mensajes)}</b>`)}">
          <rect x="${m.l + bw * i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>
          ${h > 0 ? `<path d="${barra(cx - ancho / 2, Y(x.votos), ancho, h)}" fill="var(--g-bar)"/>` : ''}
          ${i === pico || i === d.length - 1 ? `<text class="g-dir" x="${cx}" y="${Y(x.votos) - 7}" text-anchor="middle">${num(x.votos)}</text>` : ''}
          <text class="g-eje" x="${cx}" y="${H - 8}" text-anchor="middle">${semTxt(x.semana)}</text></g>` }).join('')}
    </svg>`
  }

  // Barras horizontales: temas
  function gTemas() {
    const d = S.temas || []; if (!d.length) return ''
    const max = Math.max(...d.map(x => x.participaciones)), tot = d.reduce((a, x) => a + x.participaciones, 0)
    return fig('temas', 'De qué temas se votó', `Participaciones por tema de la votación. ${pct(d[0].participaciones, tot)} % fueron sobre ${d[0].tema.toLowerCase()}.`,
      `<div class="hb">${d.map(x => `<span class="hb-l">${esc(x.tema)}</span><span class="hb-f" data-tip="${esc(`<b>${esc(x.tema)}</b><br>${num(x.votaciones)} votaciones<br>${num(x.participaciones)} participaciones (${pct(x.participaciones, tot)} %)`)}"><span class="hb-b" style="width:${(x.participaciones / max * 82).toFixed(1)}%"></span><span class="hb-v">${num(x.participaciones)} · ${pct(x.participaciones, tot)} %</span></span>`).join('')}</div>`
      + tabla(['Tema', 'Votaciones', 'Participaciones'], d.map(x => [x.tema, num(x.votaciones), num(x.participaciones)])), FUENTE())
  }

  // Barras apiladas al 100 %: votaciones más concurridas
  function gVotaciones() {
    const d = (S.votaciones || []).filter(x => x.si + x.no + x.abs >= 3); if (!d.length) return ''
    const fecha = f => { const [y, mm, dd] = String(f).split('-').map(Number); return `${dd} de ${MES[mm - 1]}` }
    const corta = t => String(t).length >= 220 ? String(t).replace(/\s+\S*$/, '') + '…' : t
    return fig('votaciones', 'Las votaciones con más participación', 'Cómo votaron las butacas en las consultas más concurridas de la primera versión.',
      `<ul class="g-leyenda"><li><i class="cuad" style="background:var(--g-si)"></i>Sí</li><li><i class="cuad" style="background:var(--g-abs)"></i>Abstención</li><li><i class="cuad" style="background:var(--g-no)"></i>No</li></ul>`
      + d.map(x => { const t = x.si + x.no + x.abs, seg = (k, cls, nom) => { const p = pct(x[k], t); return x[k] ? `<span class="${cls}" style="flex:${x[k]} 1 0" data-tip="${esc(`<b>${nom}</b>: ${num(x[k])} butacas (${p} %)`)}">${p >= 9 ? p + ' %' : ''}</span>` : '' }
          return `<div class="vt"><p class="vt-q">${esc(corta(x.texto))}<small>${esc(x.tema)} · cerró el ${fecha(x.cierre)} · ${num(t)} butacas</small></p><div class="vt-b" role="img" aria-label="${esc(`Sí ${pct(x.si, t)} %, abstención ${pct(x.abs, t)} %, no ${pct(x.no, t)} %`)}">${seg('si', 'si', 'Sí')}${seg('abs', 'abs', 'Abstención')}${seg('no', 'no', 'No')}</div></div>` }).join('')
      + tabla(['Votación', 'Sí', 'Abst.', 'No', 'Total'], d.map(x => [corta(x.texto), num(x.si), num(x.abs), num(x.no), num(x.si + x.abs + x.no)])),
      'Los resultados reflejan la opinión de las butacas que participaron en cada votación; no son una encuesta representativa de toda la población. ' + FUENTE())
  }

  // Nube de palabras
  const NUBE_FUERA = ['necesitamos', 'importante', 'contra', 'entrar', 'fecha', 'falta', 'situación', 'realidad', 'pagar', 'daño', 'trabajo', 'apoyo', 'apoyar', 'acciones', 'proceso', 'intereses', 'medios']
  const NOMBRES = { 'maría': 'María', 'maria': 'María', corina: 'Corina', machado: 'Machado', trump: 'Trump', delcy: 'Delcy', 'rodríguez': 'Rodríguez', diosdado: 'Diosdado', maduro: 'Maduro', lorenzo: 'Lorenzo', mendoza: 'Mendoza', eeuu: 'EE. UU.', venezuela: 'Venezuela', dios: 'Dios', onu: 'ONU', cne: 'CNE', mcm: 'MCM' }
  function gNube() {
    const fuera = new Set([...NUBE_FUERA, ...String(CFG.nube_excluir || '').split(',')].map(w => w.trim().toLowerCase()).filter(Boolean))
    let d = (S.nube || []).filter(x => !fuera.has(String(x.palabra).toLowerCase()))
    const est = d.find(x => x.palabra === 'estados'), uni = d.find(x => x.palabra === 'unidos')
    if (est && uni) d = d.filter(x => x !== est && x !== uni).concat([{ palabra: 'Estados Unidos', n: Math.min(est.n, uni.n) }])
    const ee = d.find(x => x.palabra === 'eeuu'), eu = d.find(x => x.palabra === 'Estados Unidos')
    if (ee && eu) { d = d.filter(x => x !== ee); eu.n += ee.n }
    d = d.map(x => ({ ...x, palabra: NOMBRES[x.palabra] || x.palabra }))
    d = d.sort((a, b) => b.n - a.n).slice(0, 60); if (d.length < 8) return ''
    const max = d[0].n, min = d[d.length - 1].n
    const tam = n => (14 + (Math.sqrt(n) - Math.sqrt(min)) / (Math.sqrt(max) - Math.sqrt(min) || 1) * 30).toFixed(1)
    const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7)
    const orden = d.map((x, i) => ({ ...x, i })).sort((a, b) => hash(a.palabra) - hash(b.palabra))
    return fig('nube', 'De qué habló la gente', 'Las palabras más usadas en debates, muros, propuestas y comentarios. El tamaño indica cuántas veces se usó cada una.',
      `<div class="nube" role="list" aria-label="Nube de palabras">${orden.map(x => `<span role="listitem" class="${x.i < 8 ? 'n1' : x.i < 24 ? 'n2' : ''}" style="font-size:${tam(x.n)}px" data-tip="${esc(`<b>${esc(x.palabra)}</b>: ${num(x.n)} menciones`)}">${esc(x.palabra)}</span>`).join('')}</div>`
      + tabla(['Palabra', 'Menciones'], d.map(x => [x.palabra, num(x.n)])),
      'Solo se cuentan palabras usadas por al menos ocho butacas distintas; se omiten artículos, conectores y palabras de uso general. ' + FUENTE())
  }

  // Totales en vivo
  function gTotales() {
    const t = S.totales; if (!t) return ''
    const c = [[num(t.butacas), 'butacas verificadas'], [num(t.cuentas), 'cuentas registradas'], [num(t.votaciones), 'votaciones realizadas'], [num(t.participaciones), 'participaciones en votaciones'],
      [num(t.promedio_por_votacion), 'butacas por votación, en promedio'], [num(t.maximo_por_votacion), 'participaciones en la más concurrida'], [num(t.propuestas), 'propuestas ciudadanas'], [num(t.mensajes), 'mensajes de debate y comentarios']]
    return `<div class="cifras totales" role="list" aria-label="El Cabildo en números">${c.map(([v, l]) => `<div class="cifra" role="listitem"><b>${v}</b><span>${l}</span></div>`).join('')}</div><p class="nota-cifras">${esc(FUENTE())}</p>`
  }
  const GRAFICOS = { '[grafico:crecimiento]': gCrecimiento, '[grafico:actividad]': gActividad, '[grafico:participacion]': gActividad, '[grafico:temas]': gTemas, '[grafico:votaciones]': gVotaciones, '[nube]': gNube, '[totales]': gTotales }
  function dibujarTodo() { document.querySelectorAll('.g-lienzo[data-g="linea"]').forEach(dibujarLinea); document.querySelectorAll('.g-lienzo[data-g="barras"]').forEach(dibujarBarras) }
  let _rz; addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(dibujarTodo, 150) })
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', dibujarTodo)

  function cuerpoHtml(n) {
    const bloques = String(n.cuerpo || '').replace(/\r/g, '').split(/\n\s*\n/)
    const usaCifras = /^\s*\[cifras\]\s*$/m.test(n.cuerpo || ''), usaCita = /^\s*\[cita\]\s*$/m.test(n.cuerpo || '')
    const out = []
    bloques.forEach((b, i) => {
      const t = b.trim(); if (!t) return
      const lineas = t.split('\n').map(l => l.trim())
      if (t === '[cifras]') out.push(cifrasHtml(n))
      else if (t === '[cita]') out.push(citaHtml(n))
      else if (GRAFICOS[t.toLowerCase()]) out.push(GRAFICOS[t.toLowerCase()]())
      else if (t.startsWith('### ')) out.push(`<h3>${enLinea(t.slice(4))}</h3>`)
      else if (t.startsWith('## ')) out.push(`<h2>${enLinea(t.slice(3))}</h2>`)
      else if (lineas.every(l => l.startsWith('- '))) out.push(`<ul class="lista">${lineas.map(l => `<li>${enLinea(l.slice(2))}</li>`).join('')}</ul>`)
      else if (lineas.every(l => /^[>›]\s?/.test(l))) out.push(`<p class="quote-md">${lineas.map(l => enLinea(l.replace(/^[>›]\s?/, ''))).join('<br>')}</p>`)
      else if (lineas.every(l => l.startsWith('|'))) {
        const filas = lineas.map(l => l.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim())).filter(f => !f.every(c => /^:?-+:?$/.test(c)))
        const [cab, ...resto] = filas
        out.push(`<table class="comparacion" style="--cols:${cab.length}"><thead><tr>${cab.map(c => `<th scope="col">${enLinea(c)}</th>`).join('')}</tr></thead><tbody>${resto.map(f => `<tr>${f.map((c, k) => `<td data-col="${esc(cab[k] || '')}">${enLinea(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`)
      } else out.push(`<p${i === 0 ? ' class="lead"' : ''}>${lineas.map(enLinea).join(' ')}</p>`)
      if (i === 0 && !usaCifras) out.push(cifrasHtml(n))
      if (i === 0 && !usaCita) out.push(citaHtml(n))
    })
    return out.join('\n')
  }
  const fechaLarga = f => { const d = new Date(f + 'T12:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(/^./, x => x.toUpperCase()) }

  function pintar(d) {
    S = d.stats || {}; CFG = d.config || {}
    const notas = d.notas || [], q = new URLSearchParams(location.search).get('n') || location.hash.slice(1)
    const n = notas.find(x => x.slug === q) || notas[0]
    const art = $('nota')
    if (!n) { art.innerHTML = '<p class="vacio">Pronto vas a encontrar acá las novedades del Cabildo para la prensa.</p>' }
    else {
      document.title = 'Prensa — ' + n.titulo
      art.innerHTML = `<span class="etiqueta">${esc(n.etiqueta)}</span><h1>${esc(n.titulo)}</h1>
        ${n.bajada ? `<p class="bajada">${esc(n.bajada)}</p>` : ''}
        <div class="datos-pub"><span>Para publicación inmediata</span><span>${esc(fechaLarga(n.fecha))}</span>${n.lugar ? `<span>${esc(n.lugar)}</span>` : ''}<span>cabildodevenezuela.com</span></div>
        ${cuerpoHtml(n)}`
    }
    const otras = notas.filter(x => x !== n)
    if (otras.length) { $('otras').hidden = false; $('otras').className = 'otras'; $('otras').innerHTML = '<h2>Otras notas</h2>' + otras.map(o => `<a href="/press?n=${encodeURIComponent(o.slug)}"><small>${esc(fechaLarga(o.fecha))}</small><b>${esc(o.titulo)}</b></a>`).join('') }
    const c = d.config || {}
    if ((d.equipo || []).length || c.empresa) {
      $('equipo-sec').hidden = false
      $('empresa').innerHTML = c.empresa ? `Cabildo de Venezuela es desarrollado por <strong>${esc(c.empresa)}</strong>${c.empresa_texto ? ', ' + esc(c.empresa_texto) : '.'}` : ''
      $('equipo').innerHTML = (d.equipo || []).map(p => {
        const ini = p.nombre.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase()
        return `<div class="persona"><span class="ini" aria-hidden="true">${esc(ini)}</span><div><h3>${esc(p.nombre)}</h3>${p.cargo ? `<span class="rol">${esc(p.cargo)}</span>` : ''}${p.bio ? `<p>${esc(p.bio)}</p>` : ''}</div></div>`
      }).join('')
    }
    if (c.sobre) { $('sobre-sec').hidden = false; $('sobre').innerHTML = enLinea(c.sobre) }
    if (c.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) { $('c-email').hidden = false; $('c-email-a').textContent = c.email; $('c-email-a').href = 'mailto:' + c.email }
    dibujarTodo()
  }

  fetch(`${E.SUPABASE_URL}/rest/v1/rpc/prensa_publica`, { method: 'POST', headers: { apikey: E.SUPABASE_KEY, Authorization: `Bearer ${E.SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: '{}' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(pintar)
    .catch(() => { $('nota').innerHTML = '<p class="vacio">No pudimos cargar las notas. Probá de nuevo en un momento.</p>' })
  window.addEventListener('hashchange', () => location.reload())
})()
</script>
</body>
</html>
