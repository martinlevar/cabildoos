name = "cabildoos"
main = "src/worker.js"
compatibility_date = "2026-01-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
account_id = "adf1b988d06e8acccfc7616d676d76ce"

# ─── Producción (branch: main → cabildodevenezuela.com) ───
routes = [
  { pattern = "cabildodevenezuela.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
SUPABASE_URL = "https://ayxscmxmnoguktfgveud.supabase.co"
API_ENDPOINT = "https://api.cabildodevenezuela.com"

# SUPABASE_KEY se inyecta como wrangler secret (por env) vía GitHub Actions

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# ─── Stage (branch: stage → stage.cabildodevenezuela.com) ───
[env.stage]
routes = [
  { pattern = "stage.cabildodevenezuela.com", custom_domain = true }
]

[env.stage.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[env.stage.vars]
SUPABASE_URL = "https://ayxscmxmnoguktfgveud.supabase.co"
API_ENDPOINT = "https://api.cabildodevenezuela.com"

[env.stage.observability]
enabled = false
head_sampling_rate = 1

[env.stage.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[env.stage.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# ─── Dev (branch: dev → dev.cabildodevenezuela.com) ───
[env.dev]
routes = [
  { pattern = "dev.cabildodevenezuela.com", custom_domain = true }
]

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[env.dev.vars]
SUPABASE_URL = "https://ayxscmxmnoguktfgveud.supabase.co"
API_ENDPOINT = "https://api.cabildodevenezuela.com"

[env.dev.observability]
enabled = false
head_sampling_rate = 1

[env.dev.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
