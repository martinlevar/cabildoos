name: Deploy dev → dev.cabildodevenezuela.com

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Build
        run: pnpm run build

      - name: Inject env vars into HTML
        run: |
          ENV_SCRIPT='<script>window.__ENV={"SUPABASE_URL":"https://ayxscmxmnoguktfgveud.supabase.co/sb","SUPABASE_KEY":"${{ secrets.SUPABASE_ANON_KEY }}","API_ENDPOINT":"https://api.cabildodevenezuela.com"};<\/script>'
          sed -i "s|</head>|${ENV_SCRIPT}</head>|" dist/index.html

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: adf1b988d06e8acccfc7616d676d76ce
