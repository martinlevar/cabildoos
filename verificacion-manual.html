<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación manual — Cabildo de Venezuela</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#f3f4f8; --surface:#fff; --surface-2:#f6f7fb; --line:#e7e9f1; --ink:#12162e; --ink-2:#3b4160; --muted:#7a8099; --navy:#141a3c; --accent:#4f46e5; --accent-bg:#eef0ff; --red:#dc2626; --green:#047857; --green-bg:#e7f6ef; --amber-bg:#fff4d6; --amber:#7a4b00; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b0d1c; --surface:#151834; --surface-2:#1b1f40; --line:#2a2f57; --ink:#eef0ff; --ink-2:#c5c9e6; --muted:#8c91b5; --navy:#4f46e5; --accent:#8b85ff; --accent-bg:#232662; --green:#34d399; --green-bg:#0f2f27; --amber-bg:#3a2c0b; --amber:#f5c26b; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
.marca { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--ink-2); font-weight: 600; font-size: 14px; text-decoration: none; }
.marca img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px; box-shadow: 0 1px 2px rgba(18,22,46,.04), 0 8px 24px rgba(18,22,46,.05); }
h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; }
p { margin: 0 0 12px; color: var(--ink-2); }
.muted { color: var(--muted); font-size: 13.5px; }
.lista { margin: 14px 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.lista li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.lista li b { color: var(--ink); }
.lista .ico { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.riesgo { margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: var(--amber-bg); color: var(--amber); font-size: 13.5px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; font-size: 14.5px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 18px; border-radius: 12px; border: 0; background: var(--navy); color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.campo { display: grid; gap: 6px; margin-bottom: 12px; }
.campo label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.campo input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.campo input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sep { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: var(--muted); font-size: 12.5px; }
.sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.fotos { display: grid; gap: 12px; margin: 16px 0; }
.foto { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; padding: 10px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface-2); }
.foto.ok { border-style: solid; border-color: var(--green); background: var(--green-bg); }
.foto .prev { width: 84px; height: 64px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); object-fit: cover; display: grid; place-items: center; font-size: 24px; overflow: hidden; }
.foto .prev img { width: 100%; height: 100%; object-fit: cover; }
.foto b { display: block; font-size: 14.5px; }
.foto small { display: block; font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
.foto label.elegir { display: inline-block; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
.foto input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.estado { text-align: center; }
.estado .grande { width: 64px; height: 64px; margin: 4px auto 12px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: var(--accent-bg); color: var(--accent); }
.estado .grande.ok { background: var(--green-bg); color: var(--green); }
.err { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--red) 10%, var(--surface)); color: var(--red); font-size: 13.5px; font-weight: 600; }
.pie { margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--muted); }
.pie a { color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <a class="marca" href="/"><img src="/logo-cabildo.jpg" alt="">Cabildo de Venezuela · Soporte</a>
  <section class="card" id="vista"><p class="muted">Cargando…</p></section>
  <p class="pie">¿Dudas? Escribinos a <a href="mailto:soporte@cabildodevenezuela.com">soporte@cabildodevenezuela.com</a> · <a href="/privacidad.html">Privacidad</a></p>
</main>
<script src="/ux2/vendor/supabase-2.117.2.js"></script>
<script>
(() => {
  const VERSION = 'v1-2026-10'
  const sb = window.supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_KEY)
  const FN = window.__ENV.SUPABASE_URL + '/functions/v1/verif-manual'
  const token = (new URLSearchParams(location.search).get('t') || '').trim()
  const $ = s => document.querySelector(s)
  const vista = $('#vista')
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const fotos = { selfie: null, frente: null, dorso: null }

  function estado(ico, titulo, texto, extra = '', ok = false) {
    vista.innerHTML = `<div class="estado"><div class="grande ${ok ? 'ok' : ''}">${ico}</div><h1>${titulo}</h1><p>${texto}</p>${extra}</div>`
  }

  async function iniciar() {
    if (!/^[0-9a-f]{48}$/.test(token)) return estado('⚠️', 'Link incompleto', 'Abrí el link tal cual te llegó en el email de soporte. Si no funciona, respondé ese email y te mandamos uno nuevo.')
    const { data: { session } } = await sb.auth.getSession()
    if (!session) return pintarLogin()
    const { data, error } = await sb.rpc('vm_estado', { p_token: token })
    if (error) return estado('⚠️', 'No pudimos cargar tu solicitud', 'Probá recargar la página en unos minutos.')
    if (!data?.existe) return estado('⚠️', 'Este link ya no existe', 'Puede que te hayamos mandado uno más nuevo. Revisá el último email de soporte o respondelo y te ayudamos.')
    if (!data.es_tuyo) return estado('🔒', 'Este link es para otra cuenta', `Entraste como <b>${esc(session.user.email)}</b>, pero este link se generó para otra cuenta del Cabildo. Cerrá sesión y entrá con la cuenta que usaste para escribirnos.`,
      '<button class="btn sec" id="salir">Cerrar sesión</button>')
    const e = data.estado
    if (e === 'aprobado') return estado('✓', `Tu butaca #${esc(data.butaca)} ya está activa`, 'Tu verificación manual fue aprobada y tus fotos ya se borraron.', '<a class="btn" href="/ux2/">Entrar al Cabildo</a>', true)
    if (e === 'subido') return estado('⏳', 'Recibimos tus fotos', 'Una persona del equipo las va a revisar. Te avisamos por email cuando esté lista tu butaca. Las fotos se borran apenas termine la revisión.')
    if (e === 'rechazado') return estado('✕', 'No pudimos aprobar la verificación', `${data.motivo ? esc(data.motivo) + '. ' : ''}Tus fotos ya se borraron. Si querés, respondé el email de soporte y lo vemos.`)
    if (e === 'vencido' || e === 'cancelado') return estado('⌛', 'Este link venció', 'Por seguridad, cada link dura 7 días. Respondé el email de soporte y te mandamos uno nuevo.')
    if (e === 'enviado') return pintarConsentimiento()
    if (e === 'aceptado') return pintarFotos()
    estado('⚠️', 'Estado desconocido', 'Respondé el email de soporte y lo revisamos.')
  }

  function pintarLogin(msg = '') {
    vista.innerHTML = `<h1>Verificación manual</h1><p>Para continuar, entrá con la <b>misma cuenta del Cabildo</b> con la que nos escribiste.</p>
      <form id="f-login"><div class="campo"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
      <div class="campo"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="b-login">Entrar</button></form>
      <div class="sep">o</div><button class="btn sec" id="google">Entrar con Google</button>
      <p class="muted" style="margin-top:12px">Si al entrar con Google te lleva al inicio del Cabildo, volvé a abrir el link del email: ya vas a tener la sesión iniciada.</p>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}`
    $('#f-login').addEventListener('submit', async ev => {
      ev.preventDefault(); const b = $('#b-login'); b.disabled = true; b.textContent = 'Entrando…'
      const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value })
      if (error) return pintarLogin('Email o contraseña incorrectos.')
      iniciar()
    })
    $('#google').addEventListener('click', () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href } }))
  }

  function pintarConsentimiento() {
    vista.innerHTML = `<h1>Verificación manual</h1>
      <p>La verificación automática no funcionó en tu caso. Podés completarla de forma manual: subís una <b>selfie</b> y las <b>dos caras de tu documento</b>, y una persona del equipo las revisa.</p>
      <ul class="lista">
        <li><span class="ico">1</span><span><b>Una persona va a ver tu documento y tu cara.</b> A diferencia de la verificación automática, acá el documento no se pixela: alguien del equipo lo mira para confirmar que sos vos.</span></li>
        <li><span class="ico">2</span><span><b>Las fotos se guardan en un depósito privado</b> al que solo entran administradores. Cada vez que alguien las abre, queda registrado.</span></li>
        <li><span class="ico">3</span><span><b>Se borran apenas termina la revisión</b>, se apruebe o no, y como máximo a los 7 días.</span></li>
        <li><span class="ico">4</span><span><b>Del documento no guardamos nada legible:</b> solo una huella cifrada del número, para que no se use en dos cuentas.</span></li>
        <li><span class="ico">5</span><span><b>Tu voto sigue siendo secreto.</b> El Cabildo no guarda qué vota cada butaca.</span></li>
      </ul>
      <p class="riesgo"><b>El riesgo:</b> siempre que una persona ve un documento existe la posibilidad de un error humano o de un acceso indebido. Lo reducimos al mínimo (acceso restringido, registro y borrado), pero no lo podemos eliminar del todo. Si no te sentís cómodo, no sigas: podés volver a intentar la verificación automática cuando quieras.</p>
      <label class="check"><input type="checkbox" id="c1"><span>Entiendo que una persona del equipo va a ver mi documento y mi cara, y acepto la verificación manual.</span></label>
      <label class="check"><input type="checkbox" id="c2"><span>Soy mayor de 18 años y el documento es mío.</span></label>
      <button class="btn" id="aceptar" disabled style="margin-top:8px">Acepto y continuar</button>
      <p class="muted" style="margin-top:10px">Más detalles en la <a href="/privacidad.html">política de privacidad</a>.</p>`
    const upd = () => { $('#aceptar').disabled = !($('#c1').checked && $('#c2').checked) }
    $('#c1').addEventListener('change', upd); $('#c2').addEventListener('change', upd)
    $('#aceptar').addEventListener('click', async () => {
      const b = $('#aceptar'); b.disabled = true; b.textContent = 'Guardando…'
      const { error } = await sb.rpc('vm_aceptar', { p_token: token, p_version: VERSION })
      if (error) { b.disabled = false; b.textContent = 'Acepto y continuar'; return alertaError(error.message) }
      pintarFotos()
    })
  }

  const SLOTS = [
    { k: 'selfie', t: 'Tu selfie', d: 'Tu cara de frente, con buena luz y sin lentes de sol.', cap: 'user', ico: '🙂' },
    { k: 'frente', t: 'Documento: frente', d: 'Que se lean bien el nombre, el número y la foto. Sin reflejos.', cap: 'environment', ico: '🪪' },
    { k: 'dorso', t: 'Documento: dorso', d: 'La parte de atrás completa.', cap: 'environment', ico: '🔁' },
  ]
  function pintarFotos(msg = '') {
    vista.innerHTML = `<h1>Subí tus fotos</h1><p>Sacalas ahora con el celular o elegilas de tu galería. Antes de enviarlas les quitamos la ubicación y los datos del teléfono.</p>
      <div class="fotos">${SLOTS.map(s => `<div class="foto ${fotos[s.k] ? 'ok' : ''}" id="slot-${s.k}"><div class="prev">${fotos[s.k] ? `<img src="${fotos[s.k]}" alt="">` : s.ico}</div>
        <div><b>${s.t}</b><small>${s.d}</small><label class="elegir" for="in-${s.k}">${fotos[s.k] ? 'Cambiar foto' : 'Sacar o elegir foto'}</label>
        <input type="file" id="in-${s.k}" accept="image/*" capture="${s.cap}"></div></div>`).join('')}</div>
      <button class="btn" id="enviar" ${Object.values(fotos).every(Boolean) ? '' : 'disabled'}>Enviar fotos</button>
      <p class="muted" style="margin-top:10px">Las fotos se borran apenas termina la revisión, y como máximo a los 7 días.</p>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}`
    SLOTS.forEach(s => $('#in-' + s.k).addEventListener('change', async ev => {
      const f = ev.target.files?.[0]; if (!f) return
      try { fotos[s.k] = await redibujar(f) } catch (e) { return pintarFotos('No pudimos leer esa foto. Probá con otra.') }
      pintarFotos()
    }))
    $('#enviar').addEventListener('click', enviar)
  }

  // Re-dibuja la foto en un JPEG nuevo (máx. 1600 px): sin EXIF, sin ubicación, más liviana
  function redibujar(file) {
    return new Promise((ok, mal) => {
      const url = URL.createObjectURL(file), img = new Image()
      img.onload = () => {
        const max = 1600, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight))
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r)
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
        URL.revokeObjectURL(url)
        let q = 0.85, d = c.toDataURL('image/jpeg', q)
        while (d.length > 2.6e6 && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q) }
        ok(d)
      }
      img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')) }
      img.src = url
    })
  }

  async function enviar() {
    const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…'
    try {
      const { data: { session } } = await sb.auth.getSession()
      if (!session) return pintarLogin('Tu sesión venció. Entrá de nuevo.')
      const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: window.__ENV.SUPABASE_KEY, Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ accion: 'subir', token, ...fotos }) })
      const j = await r.json().catch(() => ({}))
      if (!r.ok) return pintarFotos(j.error || 'No pudimos enviar las fotos. Probá de nuevo.')
      fotos.selfie = fotos.frente = fotos.dorso = null
      estado('⏳', 'Recibimos tus fotos', 'Una persona del equipo las va a revisar. Te avisamos por email cuando tu butaca esté lista. Las fotos se borran apenas termine la revisión.')
    } catch (e) { pintarFotos('Se cortó la conexión. Probá de nuevo cuando tengas mejor señal.') }
  }

  function alertaError(m) { const p = document.createElement('p'); p.className = 'err'; p.textContent = m; vista.appendChild(p) }
  document.addEventListener('click', async e => { if (e.target.id === 'salir') { await sb.auth.signOut(); pintarLogin() } })
  iniciar()
})()
</script>
</body>
</html>
